<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Tracker</title>
<style>
:root{--c:#8b7cff;--fg:#eceef6;--mut:#8b90a5;--line:#252a3d;--card:#141829cc;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;color:var(--fg);font:500 15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
background:radial-gradient(900px 500px at 85% -10%,color-mix(in srgb,var(--c) 22%,transparent),transparent),radial-gradient(700px 500px at -10% 110%,color-mix(in srgb,var(--c) 14%,transparent),transparent),#0c0f1a;transition:background .6s}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bg span{position:absolute;color:var(--c);opacity:.09;animation:fl linear infinite;font-family:Georgia,serif}
@keyframes fl{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-15vh) rotate(360deg)}}
main{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:26px 16px 70px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;gap:12px}
h1{font:700 34px/1.1 Georgia,serif;margin:0;letter-spacing:-.5px;background:linear-gradient(90deg,var(--fg),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.days{text-align:right}.days b{font:700 46px/1 Georgia,serif;display:block;color:var(--c);text-shadow:0 0 22px color-mix(in srgb,var(--c) 55%,transparent)}
.days input{background:none;border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:3px 6px;font:inherit;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;display:flex;align-items:center;gap:12px;color:inherit;font:inherit;text-align:left;transition:transform .25s,border-color .25s}
.sc:hover{transform:translateY(-3px) rotate(-.6deg)}
.sc.on{border-color:var(--sc)}
.sc .sy{font:400 26px Georgia,serif;color:var(--sc);display:inline-block;transition:transform .5s}
.sc:hover .sy{transform:rotate(360deg) scale(1.2)}
.sc small{display:block;color:var(--mut)}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--rc);stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 5px var(--rc))}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:700}
.ring.big{width:130px;height:130px}.ring.big b{font:700 30px Georgia,serif}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;backdrop-filter:blur(6px);box-shadow:0 24px 70px #0007}
.hero{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.hero h2{font:700 40px Georgia,serif;margin:0;color:var(--c);letter-spacing:-.5px;text-shadow:0 0 28px color-mix(in srgb,var(--c) 50%,transparent)}
.hero .big-sy{font:400 56px Georgia,serif;color:var(--c);animation:bob 4s ease-in-out infinite;display:inline-block}
@keyframes bob{50%{transform:translateY(-8px) rotate(8deg)}}
.rl{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--mut);font-size:13px;font-weight:650}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sw span{border-radius:99px;padding:2px 12px;font-size:13px;font-weight:700;border:1px solid currentColor}
.tabs{display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;color:var(--mut);padding:9px 14px;font:inherit;font-weight:650;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--c)}
.ch{padding:12px 4px;border-bottom:1px solid var(--line);transition:background .3s}
.ch:hover{background:#ffffff0a;box-shadow:inset 3px 0 0 var(--c)}
.top{display:flex;align-items:center;gap:10px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--c);flex:none;cursor:pointer}
.rk{width:26px;color:var(--c);font-size:13px;font-weight:700;text-align:right}
.nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:650;letter-spacing:.15px}
.on .nm{text-decoration:line-through;color:var(--mut)}
.meta{font-size:12px;font-weight:650;color:var(--mut);white-space:nowrap}
.wbar{height:3px;background:var(--line);border-radius:2px;margin:8px 0 8px 66px;overflow:hidden}
.wbar i{display:block;height:100%;background:var(--c);width:var(--w);transform-origin:left;animation:gr 1s ease-out}
@keyframes gr{from{transform:scaleX(0)}}
.lv{display:flex;gap:6px;margin-left:66px}
.lv button{background:none;border:1px solid var(--line);color:var(--mut);border-radius:99px;padding:1px 12px;font:inherit;font-size:12px;font-weight:650;letter-spacing:.3px;cursor:pointer;transition:all .2s}
.lv button:hover{transform:scale(1.08)}
.lv .S.on{color:#58d68d;border-color:#58d68d;background:#58d68d1f}
.lv .M.on{color:#f5b041;border-color:#f5b041;background:#f5b0411f}
.lv .W.on{color:#ec7063;border-color:#ec7063;background:#ec70631f}
.nt{display:flex;gap:10px;align-items:center;margin:8px 0 0 66px}
.wt{font-size:12px;font-weight:700;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:99px;padding:1px 11px;white-space:nowrap}
.note{flex:1;min-width:0;background:#ffffff08;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px}
.note::placeholder{color:var(--mut)}
details{border-bottom:1px solid var(--line);padding:6px 0}
summary{cursor:pointer;font-weight:650;padding:6px 0;display:flex;gap:10px;align-items:center}
summary em{margin-left:auto;font-style:normal;color:var(--mut);font-size:13px}
.tp{display:flex;gap:10px;align-items:center;padding:5px 0 5px 24px}
.tp.on span{text-decoration:line-through;color:var(--mut)}
.blk{padding:4px 0 22px;border-bottom:1px solid var(--line);margin-bottom:18px}.blk:last-child{border:0;margin:0;padding-bottom:0}
.blk h3{font:700 17px Georgia,serif;margin:0 0 10px;letter-spacing:-.2px}
.in{background:#ffffff08;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 10px;font:inherit;font-weight:500;min-width:0}
.bt{background:#ffffff0d;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 16px;font:inherit;font-weight:650;cursor:pointer;transition:transform .2s}
.bt:hover{transform:translateY(-2px)}.bt.pr{background:var(--c);color:#0c0f1a;border-color:var(--c)}
.lk{background:none;border:0;color:var(--c);cursor:pointer;font:inherit;font-size:13px;font-weight:650}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px}
.clk{font:700 58px/1 Georgia,serif;margin:6px 0 12px;font-variant-numeric:tabular-nums;color:var(--c);text-shadow:0 0 30px color-mix(in srgb,var(--c) 45%,transparent)}
.pb{height:5px;background:var(--line);border-radius:3px;overflow:hidden}.pb i{display:block;height:100%;width:0;background:var(--c);border-radius:3px;transition:width 1s linear}
.g3{display:grid;grid-template-columns:1.3fr 1.6fr 90px;gap:8px;margin:12px 0}
.g4{display:grid;grid-template-columns:150px 120px 120px 1fr;gap:8px;margin:10px 0}
.stat{font:700 34px/1 Georgia,serif;color:var(--c)}
@media(max-width:640px){.g3,.g4{grid-template-columns:1fr 1fr}}
.pt{position:fixed;pointer-events:none;z-index:9;font:400 20px Georgia,serif;animation:pt .9s ease-out forwards}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.4);opacity:0}}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--c);outline-offset:2px}
@media(max-width:640px){.cards{grid-template-columns:1fr}.meta{display:none}.wbar,.lv,.nt{margin-left:36px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- futuristic layer ---- */
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--hf:"Bahnschrift","Segoe UI Semibold","SF Pro Display","Trebuchet MS",system-ui,sans-serif;--card:#0b0f1dcc}
body{background:radial-gradient(900px 520px at 88% -10%,color-mix(in srgb,var(--c) 24%,transparent),transparent),radial-gradient(700px 520px at -10% 110%,color-mix(in srgb,var(--c) 16%,transparent),transparent),#04060d}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(color-mix(in srgb,var(--c) 13%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--c) 13%,transparent) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse at 50% 25%,#000 5%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 25%,#000 5%,transparent 72%);animation:grid 14s linear infinite}
@keyframes grid{to{background-position:0 48px,48px 0}}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(380px at var(--mx,70%) var(--my,20%),color-mix(in srgb,var(--c) 17%,transparent),transparent 70%)}
h1,.days b,.sc .sy,.ring.big b,.hero h2,.hero .big-sy,.blk h3,.clk,.stat{font-family:var(--hf)}
h1{letter-spacing:1.5px}
.clk{letter-spacing:3px;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{text-shadow:0 0 46px color-mix(in srgb,var(--c) 75%,transparent)}}
.panel{border:1px solid transparent;background:linear-gradient(#090c18ea,#090c18ea) padding-box,conic-gradient(from var(--a),transparent 0 62%,var(--c) 82%,transparent 100%) border-box;animation:spin 7s linear infinite}
@keyframes spin{to{--a:360deg}}
.sc{background:#0b0f1dcc;transition:transform .25s,box-shadow .3s,border-color .3s}
.sc:hover{box-shadow:0 0 30px color-mix(in srgb,var(--sc) 35%,transparent)}
.sc.on{box-shadow:0 0 0 1px var(--sc) inset,0 0 26px color-mix(in srgb,var(--sc) 28%,transparent)}
.ring.big::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--rc) 55%,transparent);animation:rot 16s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.tabs button.on{text-shadow:0 0 14px var(--c);box-shadow:0 9px 14px -11px var(--c)}
.ch{transition:transform .25s,background .3s,box-shadow .3s}.ch:hover{transform:translateX(3px)}
.wbar i{background:linear-gradient(90deg,var(--c),#ffffffcc,var(--c));background-size:220% 100%;animation:gr 1s ease-out,sh 3.5s linear infinite}
@keyframes sh{to{background-position:-220% 0}}
input[type=checkbox]:checked{filter:drop-shadow(0 0 6px var(--c))}
.bt.pr{box-shadow:0 0 18px color-mix(in srgb,var(--c) 45%,transparent)}.bt.pr:hover{box-shadow:0 0 30px color-mix(in srgb,var(--c) 70%,transparent)}
.in:focus{border-color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 30%,transparent)}
select.in,.in option,.in optgroup,select option,select optgroup{background:#04060d;color:#eceef6;color-scheme:dark}
.in optgroup,select optgroup{color:#9aa4c7;font-weight:700}
.in option:checked,select option:checked{background:#1b2347}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.enter .hero,.enter .tabs,.enter .blk,.enter .ch,.enter details{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ---- wide layout + analytics ---- */
main{max-width:1500px;padding-left:32px;padding-right:32px}
.dgrid,.agrid{display:grid;grid-template-columns:1fr 1fr;gap:0 44px;align-items:start}
.agrid{gap:26px 44px}
.list2{display:grid;grid-template-columns:1fr 1fr;column-gap:44px;align-items:start}
.ac{min-width:0}
.ah{display:flex;align-items:center;gap:12px;margin-bottom:10px}.ah h3{margin:0!important}
.nv{margin-left:auto;display:flex;gap:6px}
.nv button{background:#ffffff0d;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:3px 11px;font:inherit;font-weight:650;cursor:pointer;transition:all .2s}
.nv button:hover{border-color:var(--c);box-shadow:0 0 12px color-mix(in srgb,var(--c) 40%,transparent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chips span{border:1px solid var(--line);border-radius:10px;padding:4px 12px;font-size:13px;color:var(--mut);background:#ffffff06}
.chips b{color:var(--fg);font-family:var(--hf);margin-right:6px;font-size:15px}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin:0 0 4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.bars{display:flex;align-items:flex-end;gap:5px;border-bottom:1px solid var(--line);padding-top:8px;margin-bottom:38px}
.bc{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;position:relative}
.bs{width:100%;max-width:48px;display:flex;flex-direction:column-reverse;gap:1px;border-radius:5px 5px 0 0;overflow:hidden;transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*35ms);transition:filter .2s}
.bs i{display:block;min-height:2px}
@keyframes grow{from{transform:scaleY(0)}}
.bc:hover .bs{filter:brightness(1.3) drop-shadow(0 0 8px var(--c))}
.bc.sel .bs{outline:2px solid #fff9;outline-offset:2px}
.bc.now .bl{color:var(--c);font-weight:700}
.bl{position:absolute;top:100%;margin-top:6px;font-size:11px;color:var(--mut);text-align:center;line-height:1.25;white-space:nowrap}
#tip{position:fixed;z-index:30;pointer-events:none;opacity:0;transition:opacity .15s;background:#0a0e1bf2;border:1px solid var(--c);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.55;box-shadow:0 0 22px color-mix(in srgb,var(--c) 30%,transparent);white-space:nowrap}
.sh{display:grid;grid-template-columns:90px 1fr 80px;gap:10px;align-items:center;margin:7px 0;font-size:13px;font-weight:650}
.sb{height:8px;background:var(--line);border-radius:5px;overflow:hidden}.sb i{display:block;height:100%;border-radius:5px;transform-origin:left;animation:gr 1s ease-out}
@media(max-width:1000px){.dgrid,.agrid,.list2{grid-template-columns:1fr}}
/* ---- ranks, bars, focus mode, avatar ---- */
.tr{min-width:38px;text-align:right;color:var(--c);font-size:12px;font-weight:700}
.hbs{flex:1;min-width:300px;display:grid;gap:22px}
.hb .hbt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-weight:650;color:var(--mut)}
.hb b{font:700 38px/1 var(--hf);color:var(--rc);text-shadow:0 0 22px color-mix(in srgb,var(--rc) 50%,transparent)}
.hbb{height:20px;border-radius:99px;background:var(--line);overflow:hidden;box-shadow:inset 0 0 14px #0009}
.hbb i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 45%,#000),var(--rc),#fff9,var(--rc));background-size:300% 100%;box-shadow:0 0 18px var(--rc);transition:width 1.3s cubic-bezier(.2,.8,.2,1);animation:sh 4s linear infinite}
.pt{z-index:60}
#fs{position:fixed;inset:0;z-index:50;display:none;grid-template-columns:minmax(200px,1fr) minmax(380px,2.2fr) minmax(260px,1.1fr);gap:30px;padding:56px calc(40px + var(--pr,0px)) 30px calc(40px + var(--pl,0px));align-items:center;background:radial-gradient(900px 600px at 50% 42%,color-mix(in srgb,var(--c) 20%,transparent),transparent),#04060de6;-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);transition:padding .55s}
#fs.on{display:grid;animation:fsin .6s cubic-bezier(.2,.8,.2,1)}
@keyframes fsin{from{opacity:0;transform:scale(1.04)}}
.fsx{position:absolute;top:16px;left:20px}
.fa{display:flex;flex-direction:column;align-items:center;gap:22px;max-height:calc(100vh - 100px);overflow:auto}
.fb{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:650;color:var(--mut)}
#fs .ring.big{width:clamp(110px,19vh,180px);height:clamp(110px,19vh,180px)}#fs .ring.big b{font-size:clamp(26px,5vh,42px)}
.fc{text-align:center;min-width:0}
.fct{font-size:18px;color:var(--mut);min-height:28px}
.fclk{font:700 clamp(64px,11vw,190px)/1 var(--hf);letter-spacing:6px;color:var(--c);margin:14px 0 22px;font-variant-numeric:tabular-nums;animation:pulse 3s ease-in-out infinite;text-shadow:0 0 60px color-mix(in srgb,var(--c) 55%,transparent)}
.fctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.pmb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 0;color:var(--mut);font-size:13px;font-weight:650}.pmb .in{width:70px;padding:5px 8px}.pml{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--fg)}.pmr{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}.fctl .pmb{width:100%;justify-content:center;margin:0}
.lc{display:flex;flex-direction:column;align-items:flex-end;margin-bottom:10px;line-height:1.1}.lc #lct{font:700 24px var(--hf);font-variant-numeric:tabular-nums;letter-spacing:1px;color:var(--fg);text-shadow:0 0 16px color-mix(in srgb,var(--c) 60%,transparent)}.lc #lcd{font-size:12px;font-weight:650;color:var(--mut);letter-spacing:.4px;margin-top:3px}.days b#dl{font-size:72px;color:#ff8a8a;text-shadow:0 0 28px #ff6b6b99}
@media(max-width:600px){header{flex-wrap:wrap}.days{margin-left:auto}.days b#dl{font-size:58px}}
.ft{margin-top:26px;text-align:center;font-size:13px;font-weight:600;color:var(--mut);letter-spacing:.3px}.ft b{color:var(--fg)}.ft .cr{color:var(--c);font-size:15px}.ft a{color:var(--c);text-decoration:none}.ft a:hover{text-decoration:underline}
.hl{display:flex;align-items:center;gap:14px;min-width:0}.pfa{position:relative;width:66px;height:66px;border-radius:50%;flex:none;cursor:pointer;display:grid;place-items:center;background:#ffffff0d;border:2px solid var(--c);box-shadow:0 0 22px color-mix(in srgb,var(--c) 45%,transparent);overflow:hidden;font-size:24px;transition:transform .25s}.pfa:hover{transform:scale(1.07) rotate(-3deg)}.pfa img{width:100%;height:100%;object-fit:cover;display:block}.pfa input{display:none}
.pfn{font:italic 700 28px/1.15 "Brush Script MT","Segoe Script","Lucida Handwriting",cursive;letter-spacing:.5px;background:linear-gradient(90deg,var(--c),#fff);-webkit-background-clip:text;background-clip:text;color:transparent;caret-color:var(--c);outline:0;cursor:text;min-width:40px;padding:0 4px 3px 0;text-shadow:none}.pfn:empty::before{content:attr(data-ph);font:600 14px var(--hf);font-style:normal;-webkit-text-fill-color:var(--mut);letter-spacing:.3px}
.fgl{width:100%}
body.fsmode{overflow:hidden}
.gi{display:flex;align-items:center;gap:12px;padding:11px 14px;margin:8px 0;border:1px solid var(--line);border-radius:12px;background:#ffffff07;cursor:pointer;position:relative;overflow:hidden;animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms);transition:transform .25s,box-shadow .3s,border-color .3s}
.gi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);box-shadow:0 0 12px var(--c)}
.gi:hover{transform:translateX(5px) scale(1.01);border-color:var(--c);box-shadow:0 0 22px color-mix(in srgb,var(--c) 28%,transparent)}
.gi .gt{flex:1;font-weight:650;transition:opacity .3s}
.gi.on{border-color:#5fd89a66;background:#5fd89a12}.gi.on::before{background:#5fd89a;box-shadow:0 0 12px #5fd89a}
.gi.on .gt{text-decoration:line-through;opacity:.5}
@media(max-width:900px){#fs.on{grid-template-columns:1fr;overflow:auto;align-items:start}.fa{max-height:none}}
:root{--aw:176px}
body{padding-left:var(--pl,0px);padding-right:var(--pr,0px);transition:padding .55s cubic-bezier(.2,.8,.2,1)}
#av{position:fixed;z-index:70;width:var(--aw);touch-action:none;transition:top .45s cubic-bezier(.2,.8,.2,1),left .45s cubic-bezier(.2,.8,.2,1),right .45s cubic-bezier(.2,.8,.2,1)}
#av.drag{transition:none}
.avf{cursor:grab;transform-origin:50% 100%;animation:idle 4.4s ease-in-out infinite;filter:drop-shadow(0 12px 20px #000a) drop-shadow(0 0 16px color-mix(in srgb,var(--c) 40%,transparent));user-select:none}
.drag .avf{cursor:grabbing;animation:none;transform:scale(1.06) rotate(-3deg)}
.avf img{display:block;width:100%;transition:transform .15s;pointer-events:none}
@keyframes idle{50%{transform:translateY(-7px) rotate(1.4deg)}}
.avf.jump{animation:jump .7s cubic-bezier(.3,1.4,.5,1)}
@keyframes jump{35%{transform:translateY(-30px) scale(1.05)}70%{transform:translateY(0) scale(1.03,.97)}}

S.av=Object.assign({dock:'l',x:0,y:14,i:0,w:innerWidth<900?128:176,sit:innerWidth<900,msg:'Hey Sid',fs:true},S.av||{});if(S.av.v!==2)Object.assign(S.av,{v:2,dock:'l',x:0,y:14});
const av=document.createElement('div');av.id='av';
av.innerHTML=`<div class="avb"><span id="avt"></span><span id="ave" hidden><input id="avin" maxlength="60"><button class="bt pr" id="avs">Save</button></span></div><div class="avf" id="avf"><img src="${AVS[S.av.i%AVS.length]}" draggable="false" alt="Study buddy"></div><div class="avm"></div>`;
document.body.appendChild(av);
const bub=av.querySelector('.avb'),f=$('#avf'),img=f.querySelector('img'),mn=av.querySelector('.avm');
let tm,ty,drag=null,editing=false;
const spark=(el,n)=>{const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;for(let i=0;i<n;i++){const e=document.createElement('i'),a=Math.random()*6.28,d=30+Math.random()*55;e.className='pt';e.textContent=['✦','✧','·','★'][i%4];e.style.cssText=`left:${x}px;top:${y}px;color:var(--c);font-size:${12+Math.random()*10}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;document.body.appendChild(e);setTimeout(()=>e.remove(),900)}};
window.avSay=(txt,ms,em)=>{if(editing)return;clearTimeout(tm);clearInterval(ty);bub.classList.remove('h');bub.style.animation='none';void bub.offsetWidth;bub.style.animation='';bub.classList.add('typing');
 const el=$('#avt');el.textContent='';const ch=[...txt];let i=0;spark(bub,6);
 ty=setInterval(()=>{if(i<ch.length){const s=document.createElement('span');s.className='lt';s.textContent=ch[i++];el.appendChild(s)}else{clearInterval(ty);bub.classList.remove('typing');if(em)el.insertAdjacentHTML('beforeend','<span class="lt wv"> '+em+'</span>')}},34);
 tm=setTimeout(()=>bub.classList.add('h'),(ms||5000)+ch.length*34)};
const menu=()=>{mn.innerHTML=`<button onclick="avEdit()">✎ Edit</button><button onclick="avSit()">${S.av.sit?'🧍 Stand':'🪑 Sit'}</button><button onclick="avNext()">🔁 Switch ${S.av.i%AVS.length+1}/${AVS.length}</button><button onclick="avFs()">⛶ Focus: ${S.av.fs?'on':'off'}</button><button onclick="avReset()">↺ Reset</button><label class="avs">Size <input type="range" min="90" max="320" value="${S.av.w}" oninput="avSize(this.value)" onchange="svl()"></label>`};
function reserve(){const a=S.av,w=av.offsetWidth,room=innerWidth>=900?w+34:0,s=document.body.style;s.setProperty('--pl',a.dock==='l'?room+'px':'0px');s.setProperty('--pr',a.dock==='r'?room+'px':'0px')}
function place(){av.style.setProperty('--aw',S.av.w+'px');const a=S.av,w=av.offsetWidth||176;
 av.className='dock'+a.dock+(a.sit?' sit':'')+(a.dock==='r'||(a.dock==='f'&&a.x+w+300>innerWidth)?' bl':'');
 av.style.top=Math.max(8,Math.min(innerHeight-130,a.y))+'px';
 if(a.dock==='l'){av.style.left='14px';av.style.right='auto'}else if(a.dock==='r'){av.style.right='14px';av.style.left='auto'}else{av.style.left=Math.max(0,Math.min(innerWidth-w,a.x))+'px';av.style.right='auto'}
 reserve();
 document.body.classList.toggle('noav',!a.fs);menu()}
const endEdit=()=>{editing=false;$('#ave').hidden=true;$('#avt').hidden=false};
window.avEdit=()=>{editing=true;clearTimeout(tm);clearInterval(ty);bub.classList.remove('h');$('#avt').hidden=true;$('#ave').hidden=false;const i=$('#avin');i.value=S.av.msg;i.focus();i.select()};
const save=()=>{const v=$('#avin').value.trim();if(v)S.av.msg=v;svl();endEdit();avSay(S.av.msg,5000,'👋')};
$('#avs').onclick=save;$('#avin').onkeydown=e=>{if(e.key==='Enter')save();if(e.key==='Escape'){endEdit();bub.classList.add('h')}};
window.avSit=()=>{S.av.sit=!S.av.sit;svl();place();avSay(S.av.sit?'Main yahin baith gayi 🪑':'Chalo, khadi ho gayi!',3000)};
window.avFs=()=>{S.av.fs=!S.av.fs;svl();place()};
window.avReset=()=>{Object.assign(S.av,{dock:'l',y:14,x:0});svl();place();avSay('Wapas apni jagah 😊',3000)};
window.avSize=v=>{S.av.w=+v;av.style.setProperty('--aw',S.av.w+'px');reserve()};
window.avNext=()=>{f.classList.remove('in','out');void f.offsetWidth;f.classList.add('out');
 setTimeout(()=>{S.av.i=(S.av.i+1)%AVS.length;img.src=AVS[S.av.i];svl();menu();f.classList.remove('out');f.classList.add('in');spark(f,14);avSay(['Naya look! 😍','Kaisi lag rahi hoon? ✨','Ye wala pasand aaya? 💜'][Math.random()*3|0],3500);setTimeout(()=>f.classList.remove('in'),650)},300)};

const poke=()=>{f.classList.remove('jump');void f.offsetWidth;f.classList.add('jump');avSay(L[Math.random()*L.length|0],4000);av.classList.toggle('open')};
f.addEventListener('pointerdown',e=>{if(e.button)return;const r=av.getBoundingClientRect();drag={dx:e.clientX-r.left,dy:e.clientY-r.top,sx:e.clientX,sy:e.clientY,mv:false};f.setPointerCapture(e.pointerId)});
f.addEventListener('pointermove',e=>{if(!drag)return;if(!drag.mv&&Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)<5)return;drag.mv=true;av.classList.add('drag');
 av.style.left=Math.max(0,Math.min(innerWidth-av.offsetWidth,e.clientX-drag.dx))+'px';av.style.top=Math.max(0,Math.min(innerHeight-60,e.clientY-drag.dy))+'px';av.style.right='auto'});
f.addEventListener('pointerup',()=>{if(!drag)return;const mv=drag.mv;drag=null;if(!mv){poke();return}
 const r=av.getBoundingClientRect(),a=S.av;a.y=r.top;a.x=r.left;a.dock=r.left<150?'l':innerWidth-r.right<150?'r':'f';svl();place();
 avSay(a.dock==='f'?'Yahan se sab dikhta hai 👀':'Jagah mil gayi, page khisak gaya 😄',3500)});
addEventListener('pointermove',e=>{if(drag)return;const r=img.getBoundingClientRect(),dx=(e.clientX-(r.left+r.width/2))/innerWidth,dy=(e.clientY-(r.top+r.height/3))/innerHeight;img.style.transform=`perspective(600px) rotateY(${dx*14}deg) rotateX(${-dy*8}deg)`});
